name: AI-Transformation Market Weekly Scan

on:
  schedule:
    # ONE cron only. Every scan consumes the server-side Firecrawl change-tracking
    # diffs, so two scans on the same day erase each other's deltas — the monthly
    # duties (reclassify / find-sites) fold into the FIRST SUNDAY of the month
    # instead of separate crons (flags derived from the date in the scan step).
    - cron: "0 0 * * 0"             # Every Sunday 00:00 UTC — weekly assurance sweep
  workflow_dispatch:                 # Manual trigger
    inputs:
      reclassify:
        description: "Re-classify all companies and flag band shifts (red delta)"
        type: boolean
        default: false
      find_sites:
        description: "Find official websites for unreachable ('site?') companies"
        type: boolean
        default: false

permissions:
  contents: write           # Needed to commit updated JSON files back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure data directory exists
        run: mkdir -p data

      # Secrets come from Doppler (EXA_API_KEY, FIRECRAWL_API_KEY, GEMINI_API_KEY
      # live in the codos-competitive-observatory project, config prd).
      # Add a single DOPPLER_TOKEN service-token secret to the repo.
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Run AI-Transformation Market scan (via Doppler)
        id: scan
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          RECLASSIFY: ${{ inputs.reclassify && '1' || '0' }}
          FIND_SITES: ${{ inputs.find_sites && '1' || '0' }}
        run: |
          # Monthly duties ride the first Sunday of the month (day 1-7):
          # find-sites every month, reclassify every other month.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY=$(date -u +%-d); MONTH=$(date -u +%-m)
            if [ "$DAY" -le 7 ]; then
              FIND_SITES=1
              if [ $((MONTH % 2)) -eq 1 ]; then RECLASSIFY=1; fi
            fi
          fi
          export RECLASSIFY FIND_SITES
          echo "RECLASSIFY=$RECLASSIFY FIND_SITES=$FIND_SITES"
          set +e
          doppler run -- python main.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # exit 3 = scan finished + snapshot saved, but the crawl layer was down
          # (Firecrawl credits/auth). Continue so the data still commits; the final
          # step fails the run so the problem is visible. Any other non-zero = crash.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Commit updated snapshot
        run: |
          git config user.name  "AI-Transformation Market Bot"
          git config user.email "observatory-bot@users.noreply.github.com"
          git add -A data/   # snapshot + insights/scan history + ledgers + overrides
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "chore: scan $(date -u '+%Y-%m-%d %H:%M')"
          # A user may add a watchlist entry mid-scan or mid-retry (api/add commits
          # straight to main) while we rewrite watchlist.json wholesale. Every
          # attempt therefore re-fetches, union-merges remote adds into our commit,
          # and only then rebases — with -X theirs (= our replayed commit, which now
          # contains the merged watchlist) so the rebase can't resurrect the race.
          # A failed rebase leaves the worktree mid-rebase — abort before retrying
          # or every retry fails identically and the whole run's data is lost.
          for i in 1 2 3 4 5; do
            git fetch origin main
            python scripts/merge_watchlist.py || true
            git add -A data/
            git commit --amend --no-edit
            if git pull --rebase --autostash -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed; retrying…"; sleep 5
          done
          echo "push failed after retries"; exit 1

      # Optional: deploy refreshed data to your own server over rsync/SSH.
      # Skipped automatically unless the VPS_HOST repo variable is set.
      # Configure: Variables VPS_HOST (e.g. user@1.2.3.4) + VPS_PATH, and Secret VPS_SSH_KEY.
      - name: Deploy data to server
        if: ${{ vars.VPS_HOST != '' }}
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PATH: ${{ vars.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${VPS_HOST##*@}" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            data/ "${VPS_HOST}:${VPS_PATH}"

      - name: Fail run if crawl layer was down
        if: steps.scan.outputs.exit_code == '3'
        run: |
          echo "::error::Firecrawl scrapes failed run-wide (insufficient credits / auth / rate limit). Snapshot committed with previous crawl statuses carried forward — top up Firecrawl credits."
          exit 1
